name: Add Project to Ecosystem

# Public issue content must never start a job with repository write access.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Reviewed, open ecosystem submission issue number"
        required: true
        type: string

permissions: {}

concurrency:
  group: ecosystem-submission-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate issue and download GitHub image without write credentials
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { prepare } = require('./scripts/ecosystem-submission.cjs');
            await prepare({ github, context, core });
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecosystem-submission
          path: |
            ${{ runner.temp }}/ecosystem-submission/submission.json
            ${{ runner.temp }}/ecosystem-submission/logo.bin
          if-no-files-found: error
          retention-days: 1

  create-pr:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ecosystem-submission
          path: ${{ runner.temp }}/ecosystem-submission
      - name: Revalidate prepared files and create a draft PR using the GitHub API
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { publish } = require('./scripts/ecosystem-submission.cjs');
            await publish({ github, context, core });
