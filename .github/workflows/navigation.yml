name: Navigation regression

on:
  pull_request:
    paths:
      - "src/components/layout/Navbar.jsx"
      - "src/app/**"
      - "scripts/navigation.test.cjs"
      - "package*.json"
      - ".github/workflows/navigation.yml"
  push:
    branches: [main]
    paths:
      - "src/components/layout/Navbar.jsx"
      - "src/app/**"
      - "scripts/navigation.test.cjs"
      - "package*.json"
      - ".github/workflows/navigation.yml"

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:navigation
